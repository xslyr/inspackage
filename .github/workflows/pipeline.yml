name: Pipeline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  POETRY_VERSION: 2.2.1

jobs:

  check_linting_and_tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Check lock file is in sync with pyproject
        run: poetry check --lock

      - name: Install dependencies
        run: poetry install --no-interaction

      # Só verifica: o CI não reformata código (ruff format --check, ruff check).
      - name: Check formatting and lint (ruff)
        run: poetry run task ruff_check

      - name: Check lint (pylint)
        run: poetry run task lint

      - name: Check tests and coverage
        run: poetry run pytest --cov=inspackage --cov-fail-under=85

  build:
    name: Build and check package
    needs: check_linting_and_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Build sdist and wheel
        run: poetry build

      # pipx já vem no runner ubuntu-latest; twine não entra como dependência do projeto.
      - name: Check metadata (twine)
        run: pipx run twine check dist/*
